(()=>{'use strict';const q=s=>document.querySelector(s),status=q('#status'),jury=q('#jury'),toggle=q('#toggle'),form=q('#form');const csrf=()=>{const v=document.cookie.split('; ').find(x=>x.startsWith('csrftoken='));return v?decodeURIComponent(v.slice(10)):''};async function post(url,data){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(data)});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw Error(d.error||'Unable to sign in. Please try again.');location.assign('/qvac-financial/app/')}toggle.addEventListener('click',()=>{const open=!form.classList.contains('open');form.classList.toggle('open',open);toggle.setAttribute('aria-expanded',String(open));if(open)q('#email').focus()});jury.addEventListener('click',async()=>{jury.disabled=true;status.textContent='Preparing your private workspace…';try{await post('/qvac-financial/auth/jury-access/',{})}catch(e){status.textContent=e.message;jury.disabled=false}});form.addEventListener('submit',async e=>{e.preventDefault();const btn=q('#submit');btn.disabled=true;status.textContent='Signing in…';try{await post('/qvac-financial/auth/login/',{email:q('#email').value,password:q('#password').value})}catch(e){status.textContent=e.message;btn.disabled=false}})})();
